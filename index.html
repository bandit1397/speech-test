<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>실시간 번역 V4</title><style>
body{font-family:system-ui,sans-serif;background:#f5f5f5;margin:0;color:#111}main{max-width:760px;margin:auto;padding:18px}.card{background:#fff;padding:16px;border-radius:14px;margin:12px 0}
input,button{box-sizing:border-box;width:100%;padding:15px;margin:6px 0;border-radius:10px;font-size:1rem}button{border:0;font-weight:700}#start{background:#111;color:#fff}.big{font-size:1.5rem;line-height:1.45;min-height:45px}
.label{font-size:.85rem;color:#666}.log{white-space:pre-wrap;font-size:.87rem;line-height:1.55;color:#555;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.m{background:#f2f2f2;padding:10px;border-radius:9px}.m b{display:block;font-size:1.15rem}.partial{opacity:.7}.ok{color:#087a2f}.err{color:#b00020}</style></head><body><main>
<h2>⚡ 실시간 번역 V4</h2><p>부분번역 최대 1회 + 발화 종료 후 최종번역 1회</p>
<div class="card"><div class="label">Gemini API Key (저장하지 않음)</div><input id="key" type="password" autocomplete="off" placeholder="API 키 입력">
<button id="test">API 연결 테스트</button><b id="api">API 미확인</b></div>
<div class="card"><button id="start">🎤 실시간 번역 시작</button><button id="stop" disabled>■ 중지</button><b id="status">대기 중</b></div>
<div class="card"><div class="label">한국어</div><div id="ko" class="big">…</div></div>
<div class="card"><div class="label">영어 <span id="etype"></span></div><div id="en" class="big">…</div></div>
<div class="card grid"><div class="m">첫 STT<b id="mstt">-</b></div><div class="m">부분번역 API<b id="mpart">-</b></div><div class="m">최종번역 API<b id="mfinalapi">-</b></div><div class="m">발화종료→최종영어<b id="mafter">-</b></div><div class="m">총 요청 수<b id="mcalls">0</b></div><div class="m">모델<b style="font-size:.82rem">3.1 Flash-Lite</b></div></div>
<div class="card"><div class="label">시간 기록</div><div id="log" class="log">아직 시작하지 않았습니다.</div></div>
<div class="card"><b>시험 문장 예:</b><br>사고가 어떻게 발생했습니까?<br>당신은 도로교통법을 위반하였습니다.<br>범인의 인상착의를 말해 주세요.</div>
<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,$=x=>document.getElementById(x),MODEL="gemini-3.1-flash-lite";
let rec,t0=0,ts=0,endT=0,first=false,latest="",partialSent=false,partialTimer=null,calls=0,utterance=0;
const elapsed=()=>t0?(performance.now()-t0)/1000:0, fromSpeech=()=>ts?(performance.now()-ts)/1000:elapsed();
function log(s){$("log").textContent+="\n"+elapsed().toFixed(2)+"초 : "+s}
function cfg(n){return{temperature:0,maxOutputTokens:n,thinkingConfig:{thinkingLevel:"minimal"}}}
function getout(d){return(d?.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("").trim().replace(/^["'“”]+|["'“”]+$/g,"")}
async function translate(text,type,myUtterance){
 const key=$("key").value.trim();if(!key||!text)return;
 calls++;$("mcalls").textContent=calls;const st=performance.now();log((type==="final"?"최종":"부분")+" 번역 요청 → "+text);
 try{
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},
   body:JSON.stringify({systemInstruction:{parts:[{text:"Translate Korean into concise natural English for face-to-face police conversation. Output English only."}]},contents:[{parts:[{text}]}],generationConfig:cfg(40)})});
  if(!r.ok)throw new Error(r.status+" "+(await r.text()).slice(0,500));const d=await r.json(),sec=(performance.now()-st)/1000,out=getout(d);
  if(myUtterance!==utterance){log("이전 발화 응답 무시 ("+sec.toFixed(2)+"초)");return}
  if(type==="partial"){
    if(endT){log("발화 종료 후 도착한 부분번역 무시 ("+sec.toFixed(2)+"초)");return}
    $("en").textContent=out;$("en").classList.add("partial");$("etype").textContent="(부분)";$("mpart").textContent=sec.toFixed(2)+"초";log("부분 영어 도착 ("+sec.toFixed(2)+"초) → "+out);
  }else{
    $("en").textContent=out;$("en").classList.remove("partial");$("etype").textContent="(최종)";$("mfinalapi").textContent=sec.toFixed(2)+"초";
    if(endT)$("mafter").textContent=((performance.now()-endT)/1000).toFixed(2)+"초";log("최종 영어 도착 ("+sec.toFixed(2)+"초) → "+out);
  }
 }catch(e){log("API 오류 → "+e.message)}
}
function considerPartial(text){
 latest=text;
 if(partialSent)return;
 clearTimeout(partialTimer);
 // Wait until STT has been stable briefly. One partial request maximum.
 partialTimer=setTimeout(()=>{if(!partialSent&&!endT&&latest){partialSent=true;translate(latest,"partial",utterance)}},350);
}
$("test").onclick=async()=>{const key=$("key").value.trim();if(!key){$("api").textContent="키를 입력하세요";return}$("api").textContent="확인 중…";const st=performance.now();
 try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify({contents:[{parts:[{text:"Translate to English. Output English only: 안녕하세요"}]}],generationConfig:cfg(20)})});
 if(!r.ok)throw new Error(await r.text());const d=await r.json();$("api").className="ok";$("api").textContent="✅ "+getout(d)+" / "+((performance.now()-st)/1000).toFixed(2)+"초"}catch(e){$("api").className="err";$("api").textContent="❌ 연결 실패";$("log").textContent=e.message}};
if(!SR){$("status").textContent="Web Speech API 미지원";$("start").disabled=true}else{
 rec=new SR();rec.lang="ko-KR";rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
 rec.onstart=()=>{t0=performance.now();ts=0;endT=0;first=false;latest="";partialSent=false;calls=0;utterance++;clearTimeout(partialTimer);$("mcalls").textContent="0";["mstt","mpart","mfinalapi","mafter"].forEach(x=>$(x).textContent="-");$("ko").textContent="듣는 중…";$("en").textContent="…";$("etype").textContent="";$("en").classList.remove("partial");$("log").textContent="0.00초 : 음성인식 시작";$("status").textContent="🟢 듣는 중";$("start").disabled=true;$("stop").disabled=false};
 rec.onspeechstart=()=>{if(!ts)ts=performance.now();log("말하기 감지")};
 rec.onresult=e=>{const newest=e.results[e.results.length-1],text=(newest?.[0]?.transcript||"").trim();if(!text)return;latest=text;$("ko").textContent=text;const fin=!!newest.isFinal;if(!first){first=true;$("mstt").textContent=fromSpeech().toFixed(2)+"초";log("첫 STT → "+text)}else log((fin?"확정":"중간")+" STT → "+text);considerPartial(text)};
 rec.onspeechend=()=>{endT=performance.now();log("말하기 종료 감지");clearTimeout(partialTimer);if(latest)translate(latest,"final",utterance)};
 rec.onerror=e=>log("STT 오류 → "+e.error);rec.onend=()=>{$("status").textContent="중지됨";$("start").disabled=false;$("stop").disabled=true};
 $("start").onclick=()=>{if(!$("key").value.trim()){$("api").textContent="API 키부터 입력하세요";return}try{rec.start()}catch(e){}};
 $("stop").onclick=()=>{clearTimeout(partialTimer);rec.stop()};
}
</script></main></body></html>
